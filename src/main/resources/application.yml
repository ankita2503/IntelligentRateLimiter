spring:
  application:
    name: intelligent-rate-limiter

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ratelimiter:
  enabled: true
  # Requests allowed per refill-period, per client.
  limit: 100
  refill-period: 1m
  # Buckets untouched for this long are discarded.
  idle-ttl: 10m
  eviction-interval: 60s
  # OPEN: admit on limiter failure. CLOSED: reject.
  fail-mode: OPEN
  key-header: X-API-Key
  excluded-paths:
    - /actuator/**

logging:
  level:
    ai.assistiv.ratelimiter: INFO
